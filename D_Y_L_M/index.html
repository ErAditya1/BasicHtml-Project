<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="x-icon" href="" />
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        position: relative;
      }

      .container {
        height: 500px;
        width: 500px;
        /* background-color: aliceblue; */
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        border-radius: 10px;
        text-align: center;
        position: relative;
      }
      .btnGroup {
        display: flex;
        justify-content: space-around;
        gap: 40px;
        margin: 20px;
        width: 100;
      }
      button {
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
        background-color: rgb(68, 216, 227);
        border-radius: 8px;
      }
      button:hover {
        transform: scale(1.2);
        transition: 0.4s;
      }
      .generateEmojie span {
        position: absolute;
        font-size: 50px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div>
          <h3>Do you love me !</h3>
        </div>
        <div class="btnGroup">
          <button class="yes">Yes</button>
          <button class="target">No</button>
        </div>
      </div>
      <div class="container2" style="display: none">
        <div>
          <h3>I love you too 💞💕</h3>
        </div>
      </div>
    </main>
    <div style="position: absolute; top: 0; left: 0">
      <div class="generateEmojie" style="position: absolute"></div>
      <div class="heartAnimation" style="position: absolute"></div>
    </div>
    <script>
      const button = document.querySelector(".target");
      document.querySelector(".yes").addEventListener("click", () => {
        setInterval(() => {
          heartGenerator();
        }, 200);
        document.querySelector(".container").style.display = "none";
        document.querySelector(".container2").style.display = "block";
      });

      button.addEventListener("mouseenter", (e) => {
        button.style.position = "absolute";
        button.style.left = 20 + Math.random() * 400 + "px";
        button.style.top = 20 + Math.random(20) * 400 + "px";
        const interval = setInterval(() => {
          generateEmojie(e);
        }, 200);
        setTimeout(() => {
          clearInterval(interval);
        }, 2000);
      });

      function generateEmojie(e) {
        console.log(e);
        let generateEmojie = document.querySelector(".generateEmojie");

        let emojie = document.createElement("span");
        emojie.innerHTML = "😠";

        let x = e.pageX;
        let y = e.pageY;
        emojie.style.left = x + "px";
        emojie.style.top = y + "px";

        let size = Math.random() * 80;
        emojie.style.width = 20 + size + "px";
        emojie.style.height = 20 + size + "px";

        // let transFormValue = Math.random()*360
        // emojie.style.transform = 'rotate(' + transFormValue + 'deg)';

        generateEmojie.appendChild(emojie);
        setTimeout(function () {
          emojie.remove();
        }, 700);
      }

      const heartGenerator = () => {
        let heartAnimation = document.querySelector(".heartAnimation");

        let heart = document.createElement("span");

        heart.innerHTML = "💖";
        heart.style.position = "absolute";
        console.log(Math.random() * 90);
        heart.style.left = Math.random() * 90 + "vw";
        heart.style.top = Math.random() * 90 + "vh";

        let size = Math.random() * 40;
        heart.style.fontSize = 20 + size + "px";
        // heart.style.height = "90px";

        let transFormValue = Math.random() * 360;
        heart.style.transform = "rotate(" + transFormValue + "deg)";

        heartAnimation.appendChild(heart);
        setTimeout(function () {
          heart.remove();
        }, 2000);
      };
    </script>
  </body>
</html>
